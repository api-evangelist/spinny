name: Spinny
description: 'Spinny (Valuedrive Technologies Ltd.) is an India-based online marketplace
  for buying and selling used cars. Every Spinny Assured car undergoes a 200-point
  quality check and comes with a 1-year warranty, a 5-day money-back guarantee, and
  hassle-free RC ownership transfer. The platform also offers instant online car valuation,
  doorstep evaluation, used-car finance and EMI, car insurance, RC transfer, scrap-car
  service, e-Challan and RTO lookups, servicing, the Spinny Max luxury tier, and a
  Partners auction platform for dealers. Backed by Accel and General Catalyst. Spinny
  publishes a consumer web experience and an llms.txt for AI agents but does not expose
  a public developer API.'
